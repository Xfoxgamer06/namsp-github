name: Build for RG35XX SP

on:
  workflow_dispatch:   # lets you start it with a button
  push:

jobs:
  build:
    # Native ARM64 machine: fast, no emulation. Debian 12 inside keeps the binary compatible with muOS.
    runs-on: ubuntu-24.04-arm
    container: debian:bookworm
    steps:
      - name: Install tools
        run: |
          apt-get update
          apt-get install -y build-essential cmake pkg-config git ca-certificates zip \
            libsdl2-dev libsdl2-ttf-dev libasound2-dev libcurl4-openssl-dev fonts-dejavu-core

      - uses: actions/checkout@v4

      - name: Get NeuralAmpModelerCore
        run: git clone --depth 1 --recurse-submodules https://github.com/sdatkinson/NeuralAmpModelerCore.git deps/NeuralAmpModelerCore

      - name: Build
        shell: bash
        run: |
          cmake -S . -B build
          if ! cmake --build build -j4 > build.log 2>&1; then
            echo "=== LAST 40 LINES ==="; tail -40 build.log
            echo "=== UNDEFINED REFERENCES ==="; grep -o "undefined reference to .*" build.log | sort -u | head -40
            echo "=== FIRST ERRORS ==="; grep -m 15 -E "error:|Error " build.log
            exit 1
          fi

      - name: Package
        run: |
          mkdir -p NAMAmp/models NAMAmp/irs NAMAmp/loops
          cp build/namsp NAMAmp/
          cp build/a2_bench NAMAmp/ || true
          cp dist/NAMAmp.sh NAMAmp/
          cp namsp.cfg.example NAMAmp/namsp.cfg
          cp /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf NAMAmp/font.ttf
          ldd NAMAmp/namsp > NAMAmp/ldd.txt || true
          objdump -T NAMAmp/namsp | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1 > NAMAmp/glibc_needed.txt || true

      - uses: actions/upload-artifact@v4
        with:
          name: NAMAmp-muOS
          path: NAMAmp
